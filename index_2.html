<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Reading List</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #fefdfb;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #2a2a2a;
      line-height: 1.6;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 2.5rem 1rem;
    }
    
    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    
    .header h1 {
      font-size: 28px;
      font-weight: 300;
      margin-bottom: 0.5rem;
      letter-spacing: 0.5px;
    }
    
    .header p {
      font-size: 13px;
      color: #888;
      font-weight: 300;
    }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 2.5rem;
    }
    
    .stat-card {
      border-radius: 8px;
      padding: 1.2rem;
      text-align: center;
    }
    
    .stat-card p:first-child {
      font-size: 11px;
      color: #999;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 400;
    }
    
    .stat-card p:last-child {
      font-size: 28px;
      font-weight: 300;
      margin: 0;
    }
    
    .stat-wish { background: #fff9f0; border: 1px solid #f0e8df; }
    .stat-wish p:last-child { color: #f4d4a0; }
    
    .stat-tbr { background: #fff5f8; border: 1px solid #f0dfe8; }
    .stat-tbr p:last-child { color: #e8c1d1; }
    
    .stat-reading { background: #f0f8fb; border: 1px solid #dce8f0; }
    .stat-reading p:last-child { color: #b8ddf5; }
    
    .stat-finished { background: #f5faf7; border: 1px solid #e5ede8; }
    .stat-finished p:last-child { color: #c4d9cc; }
    
    .stat-dnf { background: #faf5f5; border: 1px solid #ede5e5; }
    .stat-dnf p:last-child { color: #d9c4c4; }
    
    .section {
      margin-bottom: 3rem;
    }
    
    .section h2 {
      font-size: 16px;
      font-weight: 400;
      margin-bottom: 1.5rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid #ddd;
    }
    
    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 16px;
    }
    
    .book-card {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      transition: all 0.3s ease;
      border: 1px solid #ddd;
    }
    
    .book-card.wish { border-color: #f0e8df; }
    .book-card.tbr { border-color: #f0dfe8; }
    .book-card.reading { border-color: #dce8f0; }
    .book-card.finished { border-color: #e5ede8; }
    .book-card.dnf { border-color: #ede5e5; opacity: 0.6; }
    
    .book-cover {
      width: 100%;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      overflow: hidden;
    }
    
    .book-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .book-cover.wish { background: #f4d4a0; }
    .book-cover.tbr { background: #e8c1d1; }
    .book-cover.reading { background: #b8ddf5; }
    .book-cover.finished { background: #c4d9cc; }
    .book-cover.dnf { background: #f0f0f0; }
    
    .book-info {
      padding: 12px;
    }
    
    .book-info p:first-child {
      font-size: 12px;
      font-weight: 400;
      margin-bottom: 4px;
      color: #2a2a2a;
      line-height: 1.4;
    }
    
    .book-info p:nth-child(2) {
      font-size: 11px;
      color: #999;
      margin: 0 0 6px 0;
    }
    
    .stars {
      font-size: 13px;
      margin: 6px 0 0 0;
      color: #f4d4a0;
      letter-spacing: 2px;
    }
    
    .progress-bar {
      width: 100%;
      height: 3px;
      background: #e0e0e0;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 8px;
    }
    
    .progress-fill {
      height: 100%;
      border-radius: 2px;
    }
    
    .progress-text {
      font-size: 9px;
      color: #999;
      margin-top: 4px;
    }
    
    .empty-message {
      font-size: 13px;
      color: #999;
      text-align: center;
      padding: 2rem 0;
    }
    
    .footer {
      text-align: center;
      padding-top: 2rem;
      border-top: 1px solid #ddd;
    }
    
    .footer p {
      font-size: 11px;
      color: #999;
      margin: 0;
    }
    
    .footer p:last-child {
      font-size: 10px;
      color: #bbb;
      margin-top: 0.5rem;
    }
    
    .loading {
      text-align: center;
      padding-top: 4rem;
    }
    
    .error {
      background: #ffe0e0;
      border: 1px solid #ffcccc;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 2rem;
      font-size: 13px;
      color: #c00;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <script>
    const { useState, useEffect } = React;
    const root = ReactDOM.createRoot(document.getElementById('root'));

    function BookTracker() {
      const [books, setBooks] = useState({
        'Wish List': [],
        'To Be Read': [],
        'Currently Reading': [],
        'Finished': [],
        'Did Not Finish': []
      });
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      // YOUR GOOGLE SHEET ID (already inserted!)
      const SHEET_ID = '13u_bKu0Ho5iFUu0kJUCGqwnNTCnlKYEH1pCVP8SHDhg';

      useEffect(() => {
        fetchBooks();
      }, []);

      const fetchBooks = async () => {
        try {
          setLoading(true);
          const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/query?tq=SELECT A,B,C,D,E,F&key=AIzaSyDyWJWg0_5sLALFdy-IqL29KTMqQXydP1M`;
          
          const response = await fetch(url);
          const text = await response.text();
          
          const jsonString = text.match(/\{[\s\S]*\}/)[0];
          const data = JSON.parse(jsonString);
          
          const booksByStatus = {
            'Wish List': [],
            'To Be Read': [],
            'Currently Reading': [],
            'Finished': [],
            'Did Not Finish': []
          };

          if (data.table && data.table.rows) {
            data.table.rows.forEach(row => {
              if (row.c[0] && row.c[1] && row.c[2]) {
                const book = {
                  title: row.c[0].v || '',
                  author: row.c[1].v || '',
                  status: row.c[2].v || 'To Be Read',
                  coverUrl: row.c[3]?.v || '',
                  notes: row.c[4]?.v || '',
                  rating: row.c[5]?.v || ''
                };

                const status = book.status.trim();
                if (booksByStatus[status]) {
                  booksByStatus[status].push(book);
                }
              }
            });
          }

          setBooks(booksByStatus);
          setError(null);
        } catch (err) {
          console.error('Error:', err);
          setError('Unable to load books. Please check your sheet and make sure it\'s publicly shared.');
        } finally {
          setLoading(false);
        }
      };

      const colors = {
        'Wish List': { bg: '#fff9f0', border: '#f0e8df', number: '#f4d4a0', class: 'wish' },
        'To Be Read': { bg: '#fff5f8', border: '#f0dfe8', number: '#e8c1d1', class: 'tbr' },
        'Currently Reading': { bg: '#f0f8fb', border: '#dce8f0', number: '#b8ddf5', class: 'reading' },
        'Finished': { bg: '#f5faf7', border: '#e5ede8', number: '#c4d9cc', class: 'finished' },
        'Did Not Finish': { bg: '#faf5f5', border: '#ede5e5', number: '#d9c4c4', class: 'dnf' }
      };

      const statuses = ['Wish List', 'To Be Read', 'Currently Reading', 'Finished', 'Did Not Finish'];

      const renderStars = (rating) => {
        if (!rating) return '';
        const stars = parseInt(rating);
        if (stars < 1 || stars > 5) return '';
        return '★'.repeat(stars);
      };

      if (loading) {
        return React.createElement('div', { className: 'container' },
          React.createElement('div', { className: 'loading' },
            React.createElement('p', null, 'Loading your books...')
          )
        );
      }

      const totalBooks = statuses.reduce((sum, status) => sum + books[status].length, 0);

      return React.createElement('div', { style: { minHeight: '100vh' } },
        React.createElement('div', { className: 'container' },
          // Header
          React.createElement('div', { className: 'header' },
            React.createElement('h1', null, 'My Reading List'),
            React.createElement('p', null, 'Tracking books I want to read')
          ),

          // Stats
          React.createElement('div', { className: 'stats' },
            statuses.map(status => 
              React.createElement('div', { 
                key: status, 
                className: `stat-card stat-${colors[status].class}` 
              },
                React.createElement('p', null, status),
                React.createElement('p', null, books[status].length)
              )
            )
          ),

          // Error
          error && React.createElement('div', { className: 'error' }, error),

          // Sections
          statuses.map(status =>
            React.createElement('div', { key: status, className: 'section' },
              React.createElement('h2', null, status),
              
              books[status].length === 0 ?
                React.createElement('p', { className: 'empty-message' }, 'No books yet') :
                React.createElement('div', { className: 'books-grid' },
                  books[status].map((book, idx) =>
                    React.createElement('div', { key: idx, className: `book-card ${colors[status].class}` },
                      React.createElement('div', { className: `book-cover ${colors[status].class}` },
                        book.coverUrl ?
                          React.createElement('img', { src: book.coverUrl, alt: book.title }) :
                          React.createElement('span', null, '📖')
                      ),
                      React.createElement('div', { className: 'book-info' },
                        React.createElement('p', null, book.title),
                        React.createElement('p', null, book.author),
                        
                        // Show stars if book is Finished
                        status === 'Finished' && book.rating &&
                          React.createElement('p', { className: 'stars' }, renderStars(book.rating)),
                        
                        // Show progress for Currently Reading
                        status === 'Currently Reading' && book.notes &&
                          React.createElement(React.Fragment, null,
                            React.createElement('div', { className: 'progress-bar' },
                              React.createElement('div', { 
                                className: 'progress-fill',
                                style: { width: `${parseInt(book.notes)}%`, background: colors[status].number }
                              })
                            ),
                            React.createElement('p', { className: 'progress-text' }, `${book.notes}% done`)
                          ),
                        
                        // Show reason for DNF
                        status === 'Did Not Finish' && book.notes &&
                          React.createElement('p', { style: { fontSize: '9px', color: '#999', marginTop: '6px', fontStyle: 'italic' } }, book.notes)
                      )
                    )
                  )
                )
            )
          ),

          // Footer
          React.createElement('div', { className: 'footer' },
            React.createElement('p', null, `Last updated: ${new Date().toLocaleDateString()}`),
            React.createElement('p', null, `Total books tracked: ${totalBooks}`)
          )
        )
      );
    }

    root.render(React.createElement(BookTracker));
  </script>
</body>
</html>
